[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poltergeist-agent"
version = "0.1.0"
description = "Read-only research agent for Crucibo backtest bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
poltergeist = "poltergeist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
